name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v1.4.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  compile:
    name: Compile check
    uses: ./.github/workflows/build.yml

  deb:
    name: Build .deb
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches package version
        run: |
          VERSION=$(sed -n 's/^PACKAGE_VERSION="\([0-9][^"]*\)"/\1/p' aic8800_linux_driver/build-debian-package.sh | head -1)
          case "$TAG" in
            "v${VERSION}"|"v${VERSION}"-*) ;;
            *) echo "Tag $TAG does not match package version $VERSION"; exit 1 ;;
          esac

      - name: Build package
        working-directory: aic8800_linux_driver
        run: ./build-debian-package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: aic8800_linux_driver/*.deb
          if-no-files-found: error

  rpm:
    name: Build .rpm
    needs: compile
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install build dependencies
        run: dnf install -y rpm-build tar gzip

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches package version
        run: |
          VERSION=$(rpmspec -q --qf '%{VERSION}\n' --srpm aic8800_linux_driver/rpm/ugreen-cm762-aic8800-dkms.spec)
          case "$TAG" in
            "v${VERSION}"|"v${VERSION}"-*) ;;
            *) echo "Tag $TAG does not match package version $VERSION"; exit 1 ;;
          esac

      - name: Build package
        working-directory: aic8800_linux_driver
        run: ./build-rpm-package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: aic8800_linux_driver/*.rpm
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [deb, rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
